name: PR Quality Check

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # global.json pins SDK 10.0.0 with rollForward: latestMajor, so anything below 10 cannot build.
        dotnet-version: '10.0.x'

    - name: Detect changed components
      id: detect_components
      run: |
        # Tools/components.py maps the changed paths onto components, lists the shared files no
        # component owns, and adds the components that depend on a changed one; --format github
        # emits key=value lines for $GITHUB_OUTPUT.
        python3 Tools/components.py changed \
          --base "${{ github.event.pull_request.base.sha }}" \
          --format github >> "$GITHUB_OUTPUT"
        echo "changed:  ${{ steps.detect_components.outputs.changed_components }}"
        echo "affected: ${{ steps.detect_components.outputs.affected_components }}"
        echo "shared files: ${{ steps.detect_components.outputs.shared_files_count }}"

    - name: Build project
      id: build_check
      run: |
        echo "Building project..."
        
        # Restore dependencies
        dotnet restore
        
        # Build the project
        if dotnet build --configuration Release --no-restore; then
          echo "✅ Build successful"
          echo "build_status=success" >> $GITHUB_OUTPUT
          echo "build_message=Project builds successfully" >> $GITHUB_OUTPUT
        else
          echo "❌ Build failed"
          echo "build_status=failed" >> $GITHUB_OUTPUT
          echo "build_message=Project build failed - please fix compilation errors" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Check code style (ReSharper)
      id: style_check
      continue-on-error: true
      run: |
        # The repository's gate is "no warning": Tools/check_style.py runs jb (the ReSharper command line),
        # turns its SARIF into a plain text report and fails on anything at WARNING or above.
        # It runs against Tools/style-baseline.txt - the findings that existed when the gate went in - so a
        # PR is blocked by what it adds, not by the debt another component already carries. Shrink the
        # baseline (python3 Tools/check_style.py --all --write-baseline Tools/style-baseline.txt) as the
        # debt is paid down; delete the flag to gate on everything at once.
        dotnet tool install --global jetbrains.resharper.globaltools
        export PATH="$PATH:$HOME/.dotnet/tools"
        python3 Tools/check_style.py --all --baseline Tools/style-baseline.txt \
          --out tmp/logs/code-style.txt --format github >> "$GITHUB_OUTPUT"

    - name: Upload the code style report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-style-report
        path: tmp/logs/code-style.txt
        if-no-files-found: ignore

    - name: Check component completeness
      if: steps.detect_components.outputs.has_component_changes == 'true'
      id: completeness_check
      continue-on-error: true
      run: |
        # The rules the PR bot used to apply inline (metadata fields, README with a usage section,
        # sources, example scene, dependency sanity) now live in a component-agnostic tool.
        python3 Tools/components.py verify \
          --component ${{ steps.detect_components.outputs.affected_components }} \
          --format github >> "$GITHUB_OUTPUT"

    - name: Check documentation
      id: component_tests
      continue-on-error: true
      run: |
        # The documentation tools are component-agnostic and baseline based, so they only fail on new
        # findings. Tools/check_doc_coverage.py also works but rebuilds the project, so it stays local.
        STATUS="passed"
        RESULTS=""
        for tool in check_doc_parity.py check_doc_examples.py check_doc_links.py; do
          echo "==> Tools/$tool"
          if ! python3 "Tools/$tool"; then
            STATUS="failed"
            RESULTS="$RESULTS\n- Tools/$tool reported problems (see the job log)"
          fi
        done
        echo "tests_status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "tests_message=Documentation checks: $STATUS" >> "$GITHUB_OUTPUT"
        echo "test_results<<EOF" >> "$GITHUB_OUTPUT"
        echo -e "$RESULTS" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Create PR comment
      uses: actions/github-script@v7
      with:
        script: |
          const buildStatus = '${{ steps.build_check.outputs.build_status }}';
          const hasComponentChanges = '${{ steps.detect_components.outputs.has_component_changes }}';
          const completenessStatus = '${{ steps.completeness_check.outputs.completeness_status }}';
          const testsStatus = '${{ steps.component_tests.outputs.tests_status }}';
          const styleStatus = '${{ steps.style_check.outputs.style_status }}';
          const styleNew = '${{ steps.style_check.outputs.style_new }}';
          const styleAccepted = '${{ steps.style_check.outputs.style_accepted }}';
          
          let comment = `## 🔍 PR Quality Check Results\n\n`;
          
          // Build status
          if (buildStatus === 'success') {
            comment += `### ✅ Build Status\n✅ **Build Successful** - Project compiles without errors\n\n`;
          } else {
            comment += `### ❌ Build Status\n❌ **Build Failed** - ${{ steps.build_check.outputs.build_message }}\n\n`;
          }
          
          // Code style: the gate is "no *new* warning", measured against the recorded baseline.
          if (styleStatus === 'passed') {
            comment += `### ✅ Code Style\n✅ **No new ReSharper warnings** (${styleAccepted} accepted by the baseline)\n\n`;
          } else {
            comment += `### ❌ Code Style\n❌ **${styleNew} new ReSharper warning(s)** - see the \`code-style-report\` artifact or run \`python Tools/check_style.py --all\`\n\n`;
          }
          
          // Component completeness check
          if (hasComponentChanges === 'true') {
            const changedComponents = '${{ steps.detect_components.outputs.changed_components }}';
            comment += `### 📦 Changed Components\n**Components:** ${changedComponents}\n\n`;
            
            if (completenessStatus === 'complete') {
              comment += `### ✅ Component Completeness\n✅ **All Required Files Present**\n\n`;
            } else {
              comment += `### ❌ Component Completeness\n❌ **Missing Required Files:**\n${{ steps.completeness_check.outputs.missing_files }}\n\n`;
            }
            
            const affected = '${{ steps.detect_components.outputs.affected_components }}';
            if (affected.trim() !== '') {
              comment += `### 🔗 Retest Scope\nComponents a change here can affect: \`${affected.trim()}\`\n\n`;
            }

            // Documentation checks
            if (testsStatus === 'passed') {
              comment += `### ✅ Documentation\n✅ **Parity and doc examples check out**\n\n`;
            } else {
              comment += `### ⚠️ Documentation\n**Issues Found:**\n${{ steps.component_tests.outputs.test_results }}\n\n`;
            }
          } else {
            comment += `### ℹ️ Component Changes\nNo component files were modified in this PR.\n\n`;
          }
          
          // Summary
          const allGood = buildStatus === 'success' && 
                         styleStatus === 'passed' &&
                         (hasComponentChanges === 'false' || 
                          (completenessStatus === 'complete' && testsStatus === 'passed'));
          
          if (allGood) {
            comment += `### 🎉 Summary\n✅ **All checks passed!** This PR is ready for review.\n\n`;
          } else {
            comment += `### 📋 Summary\n⚠️ **Some issues found.** Please address the issues above before merging.\n\n`;
          }
          
          comment += `---\n*This comment was generated automatically by the PR Quality Check workflow.*`;
          
          // Find existing comment to update
          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const existingComment = comments.data.find(c => 
            c.user.login === 'github-actions[bot]' && 
            c.body.includes('🔍 PR Quality Check Results')
          );
          
          if (existingComment) {
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

    - name: Set final status
      run: |
        BUILD_STATUS="${{ steps.build_check.outputs.build_status }}"
        HAS_CHANGES="${{ steps.detect_components.outputs.has_component_changes }}"
        COMPLETENESS="${{ steps.completeness_check.outputs.completeness_status }}"
        TESTS="${{ steps.component_tests.outputs.tests_status }}"
        STYLE="${{ steps.style_check.outputs.style_status }}"
        
        echo "## 📊 Final Status Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$BUILD_STATUS" = "success" ]; then
          echo "✅ **Build:** Successful" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build:** Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "$STYLE" = "passed" ]; then
          echo "✅ **Code style:** no new ReSharper warnings (${{ steps.style_check.outputs.style_accepted }} accepted by the baseline)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Code style:** ${{ steps.style_check.outputs.style_new }} new ReSharper warning(s) (see the code-style-report artifact)" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "$HAS_CHANGES" = "true" ]; then
          echo "📦 **Components:** ${{ steps.detect_components.outputs.changed_components }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "$COMPLETENESS" = "complete" ]; then
            echo "✅ **Completeness:** All required files present" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Completeness:** Missing required files" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "$TESTS" = "passed" ]; then
            echo "✅ **Documentation:** parity and examples passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Documentation:** some issues found" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "ℹ️ **Components:** No component changes detected" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Fail the workflow if critical issues are found
        if [ "$BUILD_STATUS" != "success" ]; then
          echo "❌ Build failed - failing the workflow"
          exit 1
        elif [ "$STYLE" != "passed" ]; then
          echo "⚠️ New code style warnings found - failing the workflow"
          exit 1
        elif [ "$HAS_CHANGES" = "true" ] && [ "$COMPLETENESS" != "complete" ]; then
          echo "⚠️ Component completeness issues found - failing the workflow"
          exit 1
        fi
        
        echo "✅ All critical checks passed"

  gdunit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache Godot
      id: godot_cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-4.7.2-mono-linux-x86_64

    - name: Install Godot (mono build, so C# scripts run)
      if: steps.godot_cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$HOME/godot"
        curl -sSL -o /tmp/godot.zip           https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
        unzip -q /tmp/godot.zip -d /tmp/godot-extract
        cp -r /tmp/godot-extract/Godot_v4.7.2-stable_mono_linux_x86_64/. "$HOME/godot/"

    - name: Run the gdUnit4 suites
      env:
        GODOT_BIN: /home/runner/godot/Godot_v4.7.2-stable_mono_linux.x86_64
      run: |
        set -o pipefail
        chmod +x "$GODOT_BIN"
        # Headless run: the cases that need a rendering device skip themselves and print a "[skip]" line.
        # The runner's "Overall Summary" cannot see those (it reports "0 skipped") and the job used to stay
        # green while the device-dependent cases did nothing, so this step reads the log itself.
        # The strict variant (a device skip is a failure) is the nightly godot-render-tests workflow.
        LOG=/tmp/gdunit.log
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
        STATUS=0
        # -e would abort the step below before the summary is written; the exit code is carried in STATUS.
        if ! python3 Tools/run_tests.py --mode all 2>&1 | tee "$LOG"; then
          STATUS=1
        fi

        # One "[skip] <case>: <reason>" line per case that skipped itself. The leading whitespace is
        # stripped and the lines are de-duplicated because the runner echoes the engine's own line.
        SKIPS=/tmp/gdunit-skips.txt
        grep -E '^[[:space:]]*\[skip\]' "$LOG" | sed -E 's/^[[:space:]]+//' | sort -u > "$SKIPS" || true
        SKIP_COUNT=$(wc -l < "$SKIPS" | tr -d '[:space:]')
        DEVICE_COUNT=$(grep -c -i 'rendering device' "$SKIPS" || true)
        {
          echo "### Cases that skipped themselves: $SKIP_COUNT"
          echo ""
          echo "Environment-dependent cases skipped: $SKIP_COUNT (without a rendering device: $DEVICE_COUNT)"
          echo ""
          if [ "$SKIP_COUNT" -gt 0 ]; then
            echo '```'
            cat "$SKIPS"
            echo '```'
            echo ""
          fi
          echo "The strict variant is the nightly \`Godot Render Tests\` workflow (\`.github/workflows/godot-render-tests.yml\`): it runs with \`--render\` and turns a device skip into a failure."
        } >> "$SUMMARY"

        # A skip is only acceptable when it names a missing *environment* facility, so the run really is a
        # reduced one. The reasons the suites emit today are:
        #   "no rendering device in this run"        (this headless job; the nightly runs with --render)
        #   "... need(s) a SceneTree; none in this run"
        #   "no system font covers CJK here" / "no Latin-only font to fall back from"
        #   "no Arial on this machine"
        # Any OTHER skip is a hole in the coverage on any machine, so the step fails instead of reporting
        # green (that is the "--fail-on-skip" behaviour we can have without a device).
        ALLOWED_ENVIRONMENT_SKIPS='no rendering device|SceneTree|font|Arial'
        UNEXPECTED=$(grep -v -E "$ALLOWED_ENVIRONMENT_SKIPS" "$SKIPS" || true)
        if [ -n "$UNEXPECTED" ]; then
          echo "::error::case(s) skipped themselves without naming a missing environment facility:"
          echo "$UNEXPECTED"
          STATUS=1
        fi

        if [ "$STATUS" -ne 0 ]; then
          echo "the gdUnit4 run did not pass (see $LOG)"
          exit 1
        fi
