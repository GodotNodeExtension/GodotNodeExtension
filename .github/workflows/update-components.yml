name: Update Components Registry

on:
  push:
    branches: [ main ]
    paths:
      - 'Component/**/component_info.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'Component/**/component_info.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-components:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Regenerate COMPONENTS.md
      id: registry
      run: |
        # Tools/components.py owns the registry format, so local runs and CI cannot drift apart.
        python3 Tools/components.py registry --write
        if git diff --quiet COMPONENTS.md; then
          echo "components_changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "components_changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat COMPONENTS.md
        fi

    - name: Commit and push changes
      if: steps.registry.outputs.components_changed == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add COMPONENTS.md
        git commit -m "🤖 Auto-update COMPONENTS.md registry

        Regenerated by Tools/components.py from the component_info.json files.

        Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
        
        git push

    - name: Create pull request comment
      if: steps.registry.outputs.components_changed == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read the updated COMPONENTS.md to show preview
          const componentsContent = fs.readFileSync('COMPONENTS.md', 'utf8');
          const tableMatch = componentsContent.match(/\| Component \| Version.*?\n((?:\|.*\n)*)/s);
          const tableRows = tableMatch ? tableMatch[1] : 'No components found';
          
          const comment = `## 🤖 Components Registry Update Preview
          
          This PR will update the COMPONENTS.md file with the following changes:
          
          ### Updated Components Table:
          | Component | Version | Author | Description | Status |
          |-----------|---------|--------|-------------|---------|
          ${tableRows}
          
          ### How it was generated
          `python Tools/components.py registry --write` (the same command you can run locally).
          
          The COMPONENTS.md file will be automatically updated when this PR is merged.
          
          ---
          *This comment was generated automatically by the Update Components Registry workflow.*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Upload COMPONENTS.md as artifact
      if: steps.registry.outputs.components_changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: updated-components-md
        path: COMPONENTS.md
        retention-days: 30

    - name: Summary
      if: always()
      run: |
        echo "## 📋 Components Registry Update Summary" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [ "${{ steps.registry.outputs.components_changed }}" = "true" ]; then
          echo "📝 **COMPONENTS.md regenerated**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "🚀 **Committed and pushed to the main branch**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "💡 **Preview available in the PR comment**" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "ℹ️ **COMPONENTS.md already matches the component metadata**" >> "$GITHUB_STEP_SUMMARY"
        fi
